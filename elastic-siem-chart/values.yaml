# Elastic Stack version
version: 8.18.3

# Elasticsearch configuration - single node, all roles, minimum viable resources
elasticsearch:
  name: es-cluster
  serviceType: LoadBalancer
  nodeSets:
    node:
      count: 1
      roles: ["master", "data", "ingest"]
      heap: "1g"
      resources:
        requests:
          memory: 1Gi
          cpu: 250m
        limits:
          memory: 2Gi
          cpu: 1000m
      storage:
        size: 5Gi
        storageClassName: local-path

# Kibana configuration - single pod
kibana:
  name: es-kibana
  count: 1
  maxOldSpaceSize: 512
  serviceType: LoadBalancer
  # Real value lives in values.local.yaml (gitignored, generated by stack/build.sh
  # or up.sh on first run). Don't put a real key here — this file is committed.
  encryptionKey: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

# Fleet Server configuration - single pod
fleet:
  name: fleet-server
  count: 1
  policyID: eck-fleet-server
  serviceType: LoadBalancer
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
